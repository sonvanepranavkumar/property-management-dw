name: 'property_management_warehouse'
version: '1.0.0'

profile: 'property_management_warehouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Reporting date used to calculate overdue rent and days overdue
  # Leave as null to use today or override
  # dbt build --vars '{as_of_date: "2026-02-28"}'
  as_of_date: null

models:
  property_management_warehouse:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
