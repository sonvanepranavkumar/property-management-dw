x-warehouse-env: &warehouse-env
  WAREHOUSE_USER: ${WAREHOUSE_USER:-dw_user}
  WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-dw_password}
  WAREHOUSE_DB: ${WAREHOUSE_DB:-property_management}

services:
  # The property management data warehouse.
  # On first start it runs 01_create_tables.sql and
  # 02_insert_sample_data.sql automatically, so the raw schema is ready.
  warehouse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-dw_user}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-dw_password}
      POSTGRES_DB: ${WAREHOUSE_DB:-property_management}
    ports:
      - "5433:5432"   # 5433 so it won't clash with a local Postgres
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./sql/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
      - ./sql/02_insert_sample_data.sql:/docker-entrypoint-initdb.d/02_insert_sample_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-dw_user} -d ${WAREHOUSE_DB:-property_management}"]
      interval: 5s
      retries: 10

  # Airflow's own metadata database (DAG runs, task states, etc.)
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 10

  # Airflow: scheduler, API server / UI and DAG processor in one container
  airflow:
    build: ./airflow
    command: standalone
    depends_on:
      warehouse-db:
        condition: service_healthy
      airflow-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      <<: *warehouse-env
      # Airflow settings
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"   # local dev only: no login
      # Airflow connection used by the source data check (conn_id: warehouse_postgres)
      AIRFLOW_CONN_WAREHOUSE_POSTGRES: postgresql://${WAREHOUSE_USER:-dw_user}:${WAREHOUSE_PASSWORD:-dw_password}@warehouse-db:5432/${WAREHOUSE_DB:-property_management}
      # Warehouse connection for dbt (read by airflow/dbt_profiles/profiles.yml)
      WAREHOUSE_HOST: warehouse-db
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_SCHEMA: ${WAREHOUSE_SCHEMA:-analytics}
      # dbt settings
      DBT_PROFILES_DIR: /opt/airflow/dbt/profiles
      DBT_PROJECT_DIR: /opt/airflow/dbt/property_management_warehouse
      DBT_TARGET_PATH: /tmp/dbt/target   # keeps dbt output out of project folder
      DBT_LOG_PATH: /tmp/dbt/logs
      DBT_SEND_ANONYMOUS_USAGE_STATS: "False"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/dbt_profiles:/opt/airflow/dbt/profiles
      - ./property_management_warehouse:/opt/airflow/dbt/property_management_warehouse

volumes:
  warehouse-data:
  airflow-db-data: